[project]
name = "tethr"
version = "0.1.0"
description = "turn free notebook gpus into one stable openai-compatible endpoint on your own machine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "kaggle>=1.6",
    "tomli-w>=1.0",
]

[project.scripts]
tethr = "tethr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tethr"]
